[package]
name = "friday-api"
version = "0.1.2"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
name = "friday-api"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.101"
axum = "0.8.8"
bytes = "1.11.1"
calamine = "0.33.0"
chrono = { version = "0.4.43", features = ["serde"] }
derive_builder = "0.20.2"
http = "1.4.0"
imap = "3.0.0-alpha.15"
mail-parser = "0.11.2"
regex = "1.12.3"
reqwest = { version = "0.13.2", features = [
  "cookies",
  "form",
  "gzip",
  "json",
  "query"
] }
rust-moysklad = "0.1.3"
rust-woocommerce = "0.1.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "0.8.6", features = [
  "chrono",
  "macros",
  "migrate",
  "postgres",
  "runtime-tokio",
  "tls-rustls",
  "uuid",
] }
tl = "0.7.8"
tokio = "1.49.0"
tower-http = { version = "0.6.8", features = ["cors", "timeout", "trace"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
uuid = { version = "1.21.0", features = ["serde", "v4"] }
